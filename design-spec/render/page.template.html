<style>
@font-face { font-family: 'Shupp'; src: url('/fonts/Shupp.otf') format('opentype'); font-display: swap; }
@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

/* Layout: the spec's own appShell pattern. A frosted 240px index on the left,
   an 860px reading column on the right. Every color below is generated from
   tokens.color.role in shupp.spec.json; nothing is hand-picked for this page. */
__ROOTCSS__

:root {
  --font-main-header: 'Shupp', 'Maitree', serif;
  --font-secondary-header: 'Cairo', system-ui, sans-serif;
  --font-body: 'Hind', system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --liquid: cubic-bezier(0.25, 0.8, 0.25, 1);
  --nav-w: 240px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background-color);
  color: var(--text-color);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary-color); }
a:hover { color: var(--primary-dark); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
code, pre { font-family: var(--font-mono); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  background: var(--nav-frost);
  backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-right: 1px solid var(--border-subtle);
  padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.25rem;
  padding-left: max(1rem, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; text-decoration: none; color: inherit; border-radius: 12px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--color-accent);
  background: linear-gradient(135deg, var(--color-secondary), var(--color-tertiary));
  display: grid; place-items: center; color: var(--color-light);
  font-family: var(--font-main-header); font-size: 1rem;
}
.brand-name { font-family: var(--font-main-header); font-size: 1.15rem; letter-spacing: 0.12em; text-transform: lowercase; color: var(--text-strong); display: block; line-height: 1.15; }
.brand-sub { font-family: var(--font-secondary-header); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--eyebrow); display: block; margin-top: 0.2rem; }
.divider { height: 1px; margin: 0 0.5rem; background: linear-gradient(to right, transparent, var(--border-color), transparent); opacity: 0.4; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.85rem; border-radius: 10px;
  font-family: var(--font-secondary-header); font-weight: 500; font-size: 0.92rem; letter-spacing: 0.01em;
  color: var(--nav-text); text-decoration: none; transition: all 0.25s var(--liquid);
}
.nav-link .n { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); width: 1.4rem; }
.nav-link:hover, .nav-link.is-hover { background: var(--hover-tint); color: var(--text-strong); }
.nav-link.active { background: var(--nav-active); color: var(--text-strong); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.6rem; }
.seg { display: inline-flex; padding: 3px; border-radius: 30px; background: var(--surface-muted); border: 1px solid var(--border-subtle); gap: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--text-muted); cursor: pointer;
  font: 500 0.75rem var(--font-secondary-header); padding: 0.3rem 0.7rem; border-radius: 30px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text-strong); box-shadow: 0 1px 3px rgba(20,8,14,0.12); }
.side-foot .lbl { font: 700 0.62rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); }

main {
  padding-block: 2.5rem 5rem;
  padding-left: max(2rem, env(safe-area-inset-left, 0px));
  padding-right: max(2rem, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.col { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 4.5rem; }
section { scroll-margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }

.eyebrow {
  font: 700 0.72rem/1 var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--eyebrow); display: flex; align-items: center; gap: 0.6rem;
}
.eyebrow .path { font-family: var(--font-mono); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-muted); font-size: 0.75rem; }
.h2 { font-family: var(--font-main-header); font-weight: 600; font-size: 2rem; color: var(--text-strong); }
.lede { font-size: 1.05rem; line-height: 1.75; color: var(--text-light); max-width: 64ch; }
.muted { color: var(--text-muted); }
.small { font-size: 0.9rem; }
.mono { font-family: var(--font-mono); font-size: 0.8rem; }

/* ---------- hero ---------- */
.q-outline { position: relative; isolation: isolate; }
.q-outline::before {
  content: ''; position: absolute; inset: 0; padding: 1.5px; border-radius: inherit;
  background: conic-gradient(from var(--angle), transparent 0%, rgba(121,148,150,0.7) 18%, rgba(172,193,150,0.85) 30%, rgba(233,235,158,0.7) 42%, transparent 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 14s linear infinite; pointer-events: none; z-index: 0;
}
@keyframes spin { to { --angle: 360deg; } }
.hero {
  background: var(--surface); border-radius: 18px; padding: 2rem 2.25rem;
  box-shadow: 0 6px 28px rgba(20,8,14,0.06); display: grid; gap: 1.5rem;
}
.hero > * { position: relative; z-index: 1; }
.hero h1 {
  font-family: var(--font-main-header); font-weight: 700; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.05;
  background: var(--heading-ink); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--text-strong);
}
.hero .thesis { font-size: 1.1rem; line-height: 1.7; color: var(--text-light); max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.75rem; border-radius: 6px;
  background: var(--hover-tint); font-size: 0.8rem; font-weight: 500; color: var(--text-light); text-decoration: none;
  transition: all 0.2s ease;
}
.chip b { font-weight: 600; color: var(--text-strong); }
a.chip:hover, .chip.is-hover { background: var(--border-subtle); color: var(--text-strong); transform: translateY(-1px); }

.invariants { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
.inv { padding: 1rem 1.1rem; border-radius: 12px; border: 1px solid var(--border-subtle); background: var(--surface); font-size: 0.92rem; line-height: 1.55; }
.test { border-left: 3px solid var(--color-accent); padding: 0.25rem 0 0.25rem 1rem; font-style: italic; color: var(--text-light); max-width: 70ch; }

/* ---------- anatomy ---------- */
.ladder { display: flex; flex-direction: column; border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; background: var(--surface); }
.rung { display: grid; grid-template-columns: 2.25rem 9rem minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding: 0.8rem 1.1rem; border-top: 1px solid var(--border-subtle); text-decoration: none; color: inherit; transition: background 0.2s ease; }
.rung:first-child { border-top: 0; }
.rung:hover { background: var(--hover-tint); color: inherit; }
.rung .i { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
.rung .k { font-family: var(--font-mono); font-size: 0.88rem; color: var(--text-strong); font-weight: 600; }
.rung .q { font-size: 0.92rem; color: var(--text-light); }
.rung .c { font: 600 0.75rem var(--font-secondary-header); color: var(--eyebrow); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }

/* ---------- color ---------- */
.brand-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.75rem; }
.sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--surface); display: flex; flex-direction: column; }
.sw .fill { height: 110px; display: flex; align-items: flex-end; padding: 0.6rem 0.7rem; font: 600 0.7rem var(--font-mono); }
.sw .meta { padding: 0.65rem 0.75rem 0.8rem; display: flex; flex-direction: column; gap: 0.15rem; }
.sw .nm { font-family: var(--font-secondary-header); font-weight: 600; font-size: 0.95rem; color: var(--text-strong); }
.sw .use { font-size: 0.8rem; line-height: 1.45; color: var(--text-muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font: 700 0.66rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
td { padding: 0.6rem 1rem; border-top: 1px solid var(--border-subtle); vertical-align: middle; }
tr:first-child td { border-top: 0; }
.pair { display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
.dot { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(128,128,128,0.35); flex-shrink: 0; }
.css { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-light); white-space: nowrap; }

/* ---------- type ---------- */
.type-list { display: flex; flex-direction: column; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface); }
.ty { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 1.25rem; align-items: baseline; padding: 0.9rem 1.1rem; border-top: 1px solid var(--border-subtle); }
.ty:first-child { border-top: 0; }
.ty .spec { display: flex; flex-direction: column; gap: 0.15rem; }
.ty .spec b { font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-strong); }
.ty .spec span { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); line-height: 1.4; }
.ty .sample { color: var(--text-strong); overflow-wrap: anywhere; min-width: 0; }
.families { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
.fam { padding: 1rem 1.1rem; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 0.4rem; }
.fam .glyph { font-size: 2.6rem; line-height: 1; color: var(--text-strong); }

/* ---------- space / radius / shadow / motion ---------- */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.panel { border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface); padding: 1.1rem; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
.panel h3 { font-family: var(--font-secondary-header); font-size: 1rem; font-weight: 600; color: var(--text-strong); }
.bar-row { display: grid; grid-template-columns: 2.5rem 4.5rem minmax(0, 1fr); gap: 0.6rem; align-items: center; font-size: 0.8rem; }
.bar { height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--color-tertiary), var(--color-accent)); }
.radii { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 0.75rem; }
.rad { display: flex; flex-direction: column; gap: 0.35rem; align-items: center; text-align: center; font-size: 0.75rem; }
.rad .box { width: 64px; height: 48px; background: var(--hover-tint); border: 1.5px solid var(--color-tertiary); }
.shadows { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; padding: 0.5rem; }
.sh { height: 72px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; font: 0.75rem var(--font-mono); color: var(--text-muted); border: 1px solid var(--border-subtle); }
.motion-demo { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.mo {
  flex: 1 1 140px; padding: 0.9rem; border-radius: 12px; background: var(--surface-muted); border: 1px solid var(--border-subtle);
  font-size: 0.8rem; cursor: default; transition: transform 0.3s var(--liquid), box-shadow 0.3s var(--liquid);
}
.mo:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 7px 14px rgba(20,8,14,0.2); }
.mo b { display: block; font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-strong); }

/* ---------- components ---------- */
.comp { border: 1px solid var(--border-subtle); border-radius: 14px; background: var(--surface); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); overflow: hidden; }
.comp .stage { padding: 1.5rem; background: var(--background-color); display: flex; flex-direction: column; gap: 1rem; justify-content: center; min-width: 0; border-right: 1px solid var(--border-subtle); }
.comp .doc { padding: 1.25rem 1.4rem; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; font-size: 0.88rem; }
.comp .doc h3 { font-family: var(--font-secondary-header); font-size: 1.1rem; font-weight: 600; color: var(--text-strong); display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.comp .doc h3 code { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
.kv { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 0.3rem 0.75rem; font-size: 0.82rem; }
.kv dt { font: 700 0.62rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); padding-top: 0.2rem; }
.kv dd { margin: 0; color: var(--text-light); overflow-wrap: anywhere; }
.kv dd ul { margin: 0; padding-left: 1rem; }
.state-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
.state { display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-start; }
.state > span { font: 0.65rem var(--font-mono); color: var(--text-muted); }

.btn {
  display: inline-block; font-family: var(--font-secondary-header); font-weight: 500; font-size: 0.95rem;
  padding: 0.5rem 1.5rem; border-radius: 30px; border: 2px solid transparent; cursor: pointer; text-decoration: none;
  transition: all 0.3s var(--liquid);
}
.btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); }
.btn-primary:hover, .btn-primary.is-hover { background: var(--btn-primary-hover); color: var(--btn-primary-fg); transform: translateY(-2px) scale(1.03); box-shadow: 0 7px 14px rgba(20,8,14,0.2), 0 3px 6px rgba(20,8,14,0.1); }
.btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-fg); border-color: var(--btn-secondary-border); }
.btn-secondary:hover, .btn-secondary.is-hover { background: var(--btn-secondary-border); color: var(--btn-secondary-hover-fg); transform: translateY(-2px); }
.btn.is-active { transform: translateY(1px) scale(0.98); }
.btn.is-focus { box-shadow: var(--focus-ring); }

.card { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 1.25rem; transition: transform 0.2s ease, box-shadow 0.2s ease; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(20,8,14,0.08); }
.card-head { display: flex; align-items: center; gap: 0.75rem; }
.badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
.badge.sage { background: linear-gradient(135deg, var(--color-tertiary), var(--color-accent)); }
.badge.slate { background: linear-gradient(135deg, var(--color-secondary), var(--color-tertiary)); }
.badge.plum { background: linear-gradient(135deg, var(--color-dark), var(--color-secondary)); }
.card-name { font-family: var(--font-secondary-header); font-weight: 600; font-size: 1.1rem; color: var(--text-strong); line-height: 1.2; }
.card-kicker { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--eyebrow); }
.card-desc { font-size: 0.9rem; line-height: 1.5; color: var(--text-light); }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }

.mini-hero { background: var(--surface); border-radius: 18px; padding: 1.4rem 1.5rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.25rem; align-items: center; box-shadow: 0 6px 28px rgba(20,8,14,0.06); }
.mini-hero > * { position: relative; z-index: 1; }
.portrait { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--color-accent); background: linear-gradient(135deg, var(--color-secondary), var(--color-tertiary)); display: grid; place-items: center; color: var(--color-light); font-family: var(--font-main-header); font-size: 1.8rem; box-shadow: 0 6px 22px rgba(20,8,14,0.14); }
.mini-hero .nm { font-family: var(--font-main-header); font-weight: 700; font-size: 1.8rem; line-height: 1.1; background: var(--heading-ink); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.mini-hero .tt { font-family: var(--font-secondary-header); font-weight: 600; color: var(--hero-title); font-size: 0.95rem; letter-spacing: 0.02em; }
.mini-hero .loc { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.82rem; color: var(--eyebrow); }
.mini-hero .loc i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-tertiary); box-shadow: 0 0 0 3px rgba(121,148,150,0.18); }
.mini-hero .tg { font-style: italic; color: var(--text-light); font-size: 0.95rem; }
.section-title { font: 700 1.1rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.12em; color: var(--eyebrow); }

/* ---------- patterns ---------- */
.pat { display: flex; flex-direction: column; gap: 0.75rem; }
.pat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.pat-head h3 { font-family: var(--font-secondary-header); font-weight: 600; font-size: 1.1rem; color: var(--text-strong); }
.pat-views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
.view { border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.view-label { font: 700 0.62rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--border-subtle); background: var(--surface); display: flex; justify-content: space-between; gap: 0.5rem; }
.view-label code { font: 0.68rem var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.canvas { padding: 0.9rem; flex: 1; min-height: 210px; }
.canvas.wf { background-color: var(--wf-bg); background-image: radial-gradient(var(--wf-dot) 1px, transparent 1px); background-size: 12px 12px; }
.canvas.st { background: var(--background-color); }
.canvas.st .pgrid { align-content: start; }
.pgrid { display: grid; gap: 0.6rem; height: 100%; min-height: 190px; }
.wf-box { border: 1.5px dashed var(--wf-line); border-radius: 6px; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; background: var(--wf-fill); }
.wf-tag { font: 0.62rem var(--font-mono); color: var(--wf-ink); display: flex; justify-content: space-between; gap: 0.4rem; }
.wf-tag em { font-style: normal; opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-line { height: 6px; border-radius: 3px; background: var(--wf-line); opacity: 0.55; }
.wf-line.s { width: 40%; } .wf-line.m { width: 70%; } .wf-line.t { height: 12px; width: 60%; opacity: 0.8; }
.wf-pill { width: 64px; height: 18px; border-radius: 30px; border: 1.5px solid var(--wf-line); }
.wf-chip { width: 46px; height: 14px; border-radius: 4px; background: var(--wf-line); opacity: 0.45; }
.wf-sq { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--wf-line); flex-shrink: 0; }
.wf-circ { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--wf-line); }
.wf-rowx { display: flex; gap: 0.4rem; align-items: center; }
.st-region { min-width: 0; display: flex; flex-direction: column; gap: 0.4rem; }
.st-nav { background: var(--nav-frost); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 0.5rem; display: flex; flex-direction: column; gap: 3px; }
.st-nav .it { font: 500 0.7rem var(--font-secondary-header); padding: 0.3rem 0.45rem; border-radius: 6px; color: var(--nav-text); }
.st-nav .it.on { background: var(--nav-active); color: var(--text-strong); }
.st-nav .wm { font-family: var(--font-main-header); font-size: 0.85rem; letter-spacing: 0.1em; color: var(--text-strong); padding: 0.2rem 0.45rem 0.4rem; }
.st-text { display: flex; flex-direction: column; gap: 0.3rem; }
.st-text .l { height: 5px; border-radius: 3px; background: var(--text-muted); opacity: 0.35; }

/* ---------- voice / rules ---------- */
.voice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.6rem; }
.trait { padding: 0.9rem 1rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-subtle); font-family: var(--font-secondary-header); font-weight: 600; color: var(--text-strong); }
.ex { display: grid; grid-template-columns: 8rem minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; background: var(--surface); }
.ex > div { padding: 0.7rem 1rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; min-width: 0; }
.ex > .h { border-top: 0; font: 700 0.62rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }

.ex .do::before { content: '✓ '; color: var(--ok); font-weight: 700; }
.ex .dont { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--bad); }
.words { display: flex; flex-wrap: wrap; gap: 0.4rem; }

.word.no { text-decoration: line-through; color: var(--text-muted); }
.lvl { font: 700 0.6rem var(--font-secondary-header); text-transform: uppercase; letter-spacing: 0.1em; padding: 0.15rem 0.5rem; border-radius: 30px; white-space: nowrap; }
.lvl.must, .lvl.high, .lvl.Fail { background: var(--bad-tint); color: var(--bad); }
.lvl.should, .lvl.medium, .lvl.Large { background: var(--warn-tint); color: var(--warn); }
.lvl.low, .lvl.AA, .lvl.AAA { background: var(--ok-tint); color: var(--ok); }
.ratio { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.acc { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
.acc li { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.92rem; }
.acc li::before { content: ''; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--color-tertiary); flex-shrink: 0; margin-top: 0.3rem; }

/* ---------- file viewer ---------- */
.file { border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.file-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: space-between; align-items: center; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border-subtle); background: var(--surface); }

.tabs button[aria-pressed="true"] { background: var(--hover-tint); color: var(--text-strong); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.copy { border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text-strong); font: 500 0.75rem var(--font-secondary-header); padding: 0.3rem 0.8rem; border-radius: 30px; cursor: pointer; }
pre.json { margin: 0; padding: 1rem 1.1rem; max-height: 520px; overflow: auto; font-size: 0.76rem; line-height: 1.55; color: var(--code-fg); }
.j-k { color: var(--code-key); } .j-s { color: var(--code-str); } .j-n { color: var(--code-num); } .j-todo { background: var(--warn-tint); color: var(--warn); border-radius: 3px; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .comp, .pat-views { grid-template-columns: minmax(0, 1fr); }

}

    padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 1rem max(16px, env(safe-area-inset-left, 0px));

  .col { gap: 3.5rem; }
  .hero { padding: 1.4rem; }
  .h2 { font-size: 1.75rem; }
  .rung { grid-template-columns: 7rem minmax(0, 1fr); }
  .rung .i, .rung .c { display: none; }
  .ty { grid-template-columns: minmax(0, 1fr); gap: 0.4rem; }
  .ex { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

}

}

<script type="application/json" id="spec">__SPEC__</script>
<script type="application/json" id="template">__TEMPLATE__</script>
<script>
(function () {
  const S = JSON.parse(document.getElementById('spec').textContent);
  const T = JSON.parse(document.getElementById('template').textContent);
  const RAW = { spec: document.getElementById('spec').textContent.trim(), template: document.getElementById('template').textContent.trim() };
  const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const keys = (o) => Object.keys(o || {}).filter((k) => !k.startsWith('$'));

  // Resolve {path.to.token} against the spec for a mode
  function get(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S.tokens); }
  function resolve(v, mode) {
    if (typeof v !== 'string') return v;
    return v.replace(/\{([^}]+)\}/g, (m, p) => {
      const t = get(p); if (t == null) return m;
      if (typeof t === 'string') return resolve(t, mode);
      if (t.$value != null) return resolve(t.$value, mode);
      if (t[mode] != null) return resolve(t[mode], mode);
      return m;
    });
  }

  // ---- icons (duotone, drawn to match Phosphor's weight)
  const ICON = {
    brain: '<path d="M12 4a3 3 0 0 0-3 3 3 3 0 0 0-3 3 3 3 0 0 0 1 5 3 3 0 0 0 5 3V4z" fill="currentColor" opacity=".25"/><path d="M12 4a3 3 0 0 0-3 3 3 3 0 0 0-3 3 3 3 0 0 0 1 5 3 3 0 0 0 5 3m0-14a3 3 0 0 1 3 3 3 3 0 0 1 3 3 3 3 0 0 1-1 5 3 3 0 0 1-5 3m0-14v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
    building: '<rect x="5" y="4" width="9" height="16" rx="1" fill="currentColor" opacity=".25"/><path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15m0-9h4a1 1 0 0 1 1 1v8M3 20h18M8 8h3M8 12h3M8 16h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" opacity=".25"/><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    globe: '<circle cx="12" cy="12" r="8" fill="currentColor" opacity=".2"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  };
  const icon = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

  // ---- sections
  const LAYERS = [
    ['identity', 'Identity', 'Why it looks this way, and what must never change'],
    ['anatomy', 'Template', 'The layers of a spec and how they stack'],
    ['color', 'Color', 'Brand values, then role values per mode'],
    ['type', 'Type', 'Families and every step of the scale'],
    ['shape', 'Space & motion', 'Spacing, radius, elevation, easing'],
    ['components', 'Components', 'Anatomy, states and rules, rendered from tokens'],
    ['patterns', 'Patterns', 'Grid areas drawn as wireframe and as styled UI'],
    ['voice', 'Voice', 'How the site talks'],
    ['rules', 'Rules & checks', 'What an agent verifies before handing back'],
    ['file', 'The file', 'The template and this site’s filled spec']
  ];
  const nav = document.getElementById('nav');
  LAYERS.forEach(([id, label], i) => {
    nav.append($(`<a class="nav-link" href="#${id}" data-id="${id}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${label}</a>`));
  });
  const app = document.getElementById('app');
  const head = (id, path, title, lede) => `<div class="eyebrow">${esc(LAYERS.find((l) => l[0] === id)[1])} <span class="path">${esc(path)}</span></div><h2 class="h2">${esc(title)}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}`;

  // 1. identity
  const m = S.meta;
  app.append($(`<section id="identity">
    <div class="hero q-outline">
      <div class="eyebrow">${esc(S.$format)} <span class="path">${esc(m.slug)}.spec.json · v${esc(m.version)}</span></div>
      <h1>${esc(m.name)} design spec</h1>
      <p class="thesis">${esc(S.identity.thesis)}</p>
      <div class="facts">
        <span class="chip">Modes <b>${m.modes.join(' + ')}</b></span>
        <span class="chip">Default <b>${esc(m.defaultMode)}</b></span>
        <span class="chip">Skins <b>${m.skins.available.join(', ')}</b></span>
        <a class="chip" href="${esc(m.source.repo)}" target="_blank" rel="noopener">${icon('globe', 14)} Source <b>${esc(m.source.tokensFile)}</b></a>
      </div>
    </div>
    <div class="eyebrow">Invariants <span class="path">identity.invariants</span></div>
    <div class="invariants">${S.identity.invariants.map((t) => `<div class="inv">${esc(t)}</div>`).join('')}</div>
    <p class="test"><strong style="font-style:normal">Identity test.</strong> ${esc(S.identity.identityTest)}</p>
  </section>`));

  // 2. anatomy
  const count = {
    meta: `${m.modes.length} modes`, identity: `${S.identity.invariants.length} invariants`,
    tokens: `${keys(S.tokens.color.brand).length + keys(S.tokens.color.role).length} colors · ${keys(S.tokens.font.scale).length} type steps`,
    components: `${keys(S.components).length} parts`, patterns: `${keys(S.patterns).length} layouts`,
    voice: `${S.voice.examples.length} examples`, rules: `${S.rules.length} rules`, contrast: `${S.contrast.length} pairs`,
    knownIssues: `${S.knownIssues.length} found`, acceptance: `${S.acceptance.length} checks`
  };
  const ANAT = [
    ['meta', 'What is this, where did it come from, which modes exist?', 'identity'],
    ['identity', 'Why does it look this way? What must never change?', 'identity'],
    ['tokens', 'Which values exist, per mode: color, type, space, radius, shadow, motion, layout, icons.', 'color'],
    ['components', 'What are the parts, their anatomy, states, a11y and do/don’t?', 'components'],
    ['patterns', 'How do parts compose into pages, as named grid areas?', 'patterns'],
    ['voice', 'How does it talk?', 'voice'],
    ['rules', 'Which constraints are checkable, and how?', 'rules'],
    ['contrast', 'Which text/background pairs are used, and do they pass?', 'rules'],
    ['knownIssues', 'Where the shipped code disagrees with the spec.', 'rules'],
    ['acceptance', 'What an agent checks before handing work back.', 'rules']
  ];
  app.append($(`<section id="anatomy">${head('anatomy', 'template.spec.json', 'One file, ten layers', 'A spec is filled top to bottom. Each layer may reference the ones above it with <code>{path.to.token}</code>, never the ones below, so a change to a brand color flows into roles, then components, then patterns. Every value carries a <code>use</code> line so an agent knows what it is for.')}
    <div class="ladder">${ANAT.map(([k, q, to], i) => `<a class="rung" href="#${to}"><span class="i">${String(i + 1).padStart(2, '0')}</span><span class="k">${k}</span><span class="q">${q}</span><span class="c">${count[k]}</span></a>`).join('')}</div>
  </section>`));

  // 3. color
  const brand = S.tokens.color.brand, role = S.tokens.color.role;
  const ink = (hex) => { const h = hex.replace('#', ''); const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14080E' : '#f3f4f6'; };
  app.append($(`<section id="color">${head('color', 'tokens.color', 'Five brand colors, fifteen roles', 'Brand values are raw and appear only in gradients and in the role layer. Components use roles, which carry one value per mode. That split is what lets the site’s PRISM and VOID skins restyle everything by remapping roles alone.')}
    <div class="brand-row">${keys(brand).map((k) => { const b = brand[k]; return `<div class="sw"><div class="fill" style="background:${b.$value};color:${ink(b.$value)}">${b.$value}</div><div class="meta"><span class="nm">${esc(b.name)}</span><span class="css">${esc(b.css)}</span><span class="use">${esc(b.use)}</span></div></div>`; }).join('')}</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Role</th><th>Light</th><th>Dark</th><th>CSS</th><th>Use</th></tr></thead>
      <tbody>${keys(role).map((k) => { const r = role[k]; const L = resolve(r.light, 'light'), D = resolve(r.dark, 'dark'); return `<tr><td class="mono" style="color:var(--text-strong)">${k}</td><td><span class="pair"><span class="dot" style="background:${L}"></span><span class="css">${esc(r.light)}</span></span></td><td><span class="pair"><span class="dot" style="background:${D}"></span><span class="css">${esc(r.dark)}</span></span></td><td class="css">${esc(r.css ?? '— no token yet')}</td><td class="small muted">${esc(r.use)}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </section>`));

  // 4. type
  const fam = S.tokens.font.family, scale = S.tokens.font.scale;
  const famCss = (f) => ({ display: 'var(--font-main-header)', heading: 'var(--font-secondary-header)', body: 'var(--font-body)', mono: 'var(--font-mono)' }[f]);
  const sample = { eyebrow: 'Companies & Ventures', label: 'Product studio', meta: 'Oct 26, 2026 · thoughtfulapp.co', small: 'Building human-centered software that respects privacy and prioritizes user wellbeing.', nav: 'Portfolio', body: 'A true strategic founder: product, design, development, marketing and writing.', lead: 'Working at the intersection of human needs and technical possibilities.', title: 'Thoughtful App Co.', h3: 'Humans Only', h2: 'Press kit', h1: 'Erikk Shupp', hero: 'building apps for hoomans' };
  app.append($(`<section id="type">${head('type', 'tokens.font', 'A handwritten mark, a tracked sans, a reading face', 'The Shupp face is Erikk’s own handwriting and appears only in the wordmark, h1 and h2. Cairo carries structure: labels, buttons, navigation. Hind carries reading.')}
    <div class="families">${keys(fam).map((k) => `<div class="fam"><span class="eyebrow">${k} <span class="path">${esc(fam[k].css ?? '')}</span></span><span class="glyph" style="font-family:${famCss(k)}">Aa Gg 26</span><span class="small muted">${esc(fam[k].$value)}</span><span class="small">${esc(fam[k].use)}</span></div>`).join('')}</div>
    <div class="type-list">${keys(scale).map((k) => { const s = scale[k]; const st = `font-family:${famCss(s.family)};font-size:${s.$value};font-weight:${s.weight};${s.tracking ? `letter-spacing:${s.tracking};` : ''}${s.case === 'upper' ? 'text-transform:uppercase;' : ''}line-height:${s.leading || 1.25};${k === 'hero' ? 'font-style:normal;' : ''}`; return `<div class="ty"><div class="spec"><b>${k}</b><span>${s.$value}${s.mobile ? ' → ' + s.mobile : ''} · ${s.family} ${s.weight}${s.tracking ? ' · ' + s.tracking : ''}</span></div><div class="sample" style="${st}">${esc(sample[k] || k)}</div></div>`; }).join('')}</div>
  </section>`));

  // 5. space, radius, shadow, motion
  const sp = S.tokens.space, rad = S.tokens.radius, sh = S.tokens.shadow, mo = S.tokens.motion;
  app.append($(`<section id="shape">${head('shape', 'tokens.space · radius · shadow · motion', 'Soft geometry that moves like liquid', esc(sp.$description) + ' Everything that lifts uses one curve, <code>' + esc(mo.easing.liquid.$value) + '</code>.')}
    <div class="grid-2">
      <div class="panel"><h3>Space</h3>${keys(sp).map((k) => `<div class="bar-row"><span class="mono">${k}</span><span class="mono muted">${sp[k].$value}</span><span style="display:flex;align-items:center;gap:.5rem;min-width:0"><span class="bar" style="width:${sp[k].px * 2.2}px;max-width:60%;flex-shrink:0"></span><span class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sp[k].use)}</span></span></div>`).join('')}</div>
      <div class="panel"><h3>Radius</h3><div class="radii">${keys(rad).map((k) => `<div class="rad"><span class="box" style="border-radius:${rad[k].$value}"></span><span class="mono">${k} · ${rad[k].$value}</span><span class="muted">${esc(rad[k].use)}</span></div>`).join('')}</div></div>
      <div class="panel"><h3>Elevation</h3><div class="shadows">${['rest', 'hover', 'hero', 'lift'].map((k) => `<div class="sh" style="box-shadow:${sh[k].$value}">${k}</div>`).join('')}<div class="sh" style="box-shadow:var(--card-shadow)">card</div><div class="sh" style="box-shadow:var(--focus-ring)">focusRing</div></div></div>
      <div class="panel"><h3>Motion <span class="small muted" style="font-weight:400">hover the tiles</span></h3><div class="motion-demo">${keys(mo.duration).map((k) => `<div class="mo" style="transition-duration:${k === 'ambient' ? '300ms' : mo.duration[k].$value}"><b>${k} · ${mo.duration[k].$value}</b><span class="muted">${esc(mo.duration[k].use)}</span></div>`).join('')}</div><p class="small muted">${esc(mo.reducedMotion)}</p></div>
    </div>
  </section>`));

  // 6. components
  const C = S.components;
  const list = (a) => a && a.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  const stage = {
    button: `<div class="state-row">${['rest', 'is-hover', 'is-active', 'is-focus'].map((s) => `<div class="state"><span>${s.replace('is-', '')}</span><a class="btn btn-primary ${s}" href="#components">Read the case study</a></div>`).join('')}</div><div class="state-row">${['rest', 'is-hover', 'is-focus'].map((s) => `<div class="state"><span>${s.replace('is-', '')}</span><a class="btn btn-secondary ${s}" href="#components">Press kit</a></div>`).join('')}</div>`,
    card: `<div class="card"><div class="card-head"><span class="badge sage">${icon('brain')}</span><div><div class="card-name">Thoughtful App Co.</div><div class="card-kicker">Product studio</div></div></div><p class="card-desc">Building human-centered software that respects privacy and prioritizes user wellbeing.</p><div class="chips"><a class="chip" href="#components">${icon('globe', 14)} thoughtfulapp.co</a></div></div>`,
    heroCard: `<div class="mini-hero q-outline"><div class="portrait" aria-hidden="true">es</div><div style="display:flex;flex-direction:column;gap:.25rem;min-width:0"><div class="nm">Erikk Shupp</div><div class="tt">Fractional founder</div><div class="loc"><i></i>Arlington, Virginia</div><div class="tg">building apps for hoomans</div></div></div>`,
    quantumOutline: `<div class="q-outline" style="border-radius:14px;background:var(--surface);padding:1.5rem;text-align:center"><span class="small muted">One per page. Static under reduced motion.</span></div>`,
    eyebrow: `<div class="section-title">Companies &amp; Ventures</div><div class="eyebrow" style="font-size:.68rem">Recent writing</div>`,
    iconBadge: `<div class="state-row">${[['sage', 'brain'], ['slate', 'building'], ['plum', 'mic']].map(([v, i]) => `<div class="state"><span>${v}</span><span class="badge ${v}">${icon(i)}</span></div>`).join('')}</div>`,
    linkChip: `<div class="state-row">${['rest', 'is-hover'].map((s) => `<div class="state"><span>${s.replace('is-', '')}</span><a class="chip ${s}" href="#components">${icon('mic', 14)} Spotify</a></div>`).join('')}</div>`,
    navItem: `<div style="display:flex;flex-direction:column;gap:2px;max-width:220px;background:var(--nav-frost);padding:.5rem;border-radius:12px;border:1px solid var(--border-subtle)"><a class="nav-link" href="#components">Home</a><a class="nav-link is-hover" href="#components">Portfolio · hover</a><a class="nav-link active" href="#components" aria-current="page">Press · active</a></div>`,
    wordmark: `<a class="brand" href="#top" style="padding:0"><span class="avatar" aria-hidden="true">s</span><span><span class="brand-name">shupp.dev</span><span class="brand-sub">Erikk Shupp</span></span></a>`
  };
  const fmtBase = (b) => b ? Object.entries(b).map(([k, v]) => `${k}: ${v}`).join(' · ') : '';
  app.append($(`<section id="components">${head('components', 'components.*', 'Nine parts, each a contract', 'Each entry names its job, its parts in reading order, the tokens it uses and its states. The previews below are styled only from role tokens, so switch the mode in the sidebar and they follow.')}
    ${keys(C).map((k) => { const c = C[k]; return `<div class="comp"><div class="stage">${stage[k] || ''}</div><div class="doc"><h3>${k} <code>wireframe: ${esc(c.wireframe?.shape)}</code></h3><p>${esc(c.purpose)}</p><dl class="kv">
      ${c.anatomy ? `<dt>Anatomy</dt><dd>${esc(c.anatomy.join(' · '))}</dd>` : ''}
      ${c.base ? `<dt>Base</dt><dd class="mono" style="font-size:.74rem">${esc(fmtBase(c.base))}</dd>` : ''}
      ${c.states ? `<dt>States</dt><dd>${list(c.states)}</dd>` : ''}
      ${c.rules ? `<dt>Rules</dt><dd>${list(c.rules)}</dd>` : ''}
      ${c.do ? `<dt>Do</dt><dd>${list(c.do)}</dd>` : ''}
      ${c.dont ? `<dt>Don’t</dt><dd>${list(c.dont)}</dd>` : ''}
      ${c.a11y ? `<dt>A11y</dt><dd>${list(c.a11y)}</dd>` : ''}
    </dl></div></div>`; }).join('')}
  </section>`));

  // 7. patterns — the same grid areas drawn twice
  const P = S.patterns;
  const wfFill = (comp) => {
    const shape = (C[comp?.split('.')[0]] || {}).wireframe?.shape;
    if (comp === 'sideNav') return '<div class="wf-rowx"><span class="wf-sq"></span><span class="wf-line s"></span></div>' + '<span class="wf-line m"></span>'.repeat(4);
    if (comp === 'heroCard.portrait') return '<span class="wf-circ"></span>';
    if (comp === 'h1 hero') return '<span class="wf-line t"></span>';
    if (shape === 'line-short') return '<span class="wf-line s"></span>';
    if (shape === 'box') return '<div class="wf-rowx"><span class="wf-sq"></span><span class="wf-line s"></span></div><span class="wf-line"></span><span class="wf-line m"></span><div class="wf-rowx"><span class="wf-chip"></span><span class="wf-chip"></span></div>';
    return '<span class="wf-line"></span><span class="wf-line m"></span><span class="wf-line s"></span>';
  };
  const stFill = (comp, name) => {
    if (comp === 'sideNav') return `<div class="st-nav"><span class="wm">shupp.dev</span><span class="it on">Home</span><span class="it">About</span><span class="it">Portfolio</span><span class="it">Press</span></div>`;
    if (comp === 'heroCard.portrait') return '<span class="st-portrait"></span>';
    if (comp === 'h1 hero') return '<span class="st-h1">Erikk Shupp</span>';
    if (comp === 'eyebrow') return '<span class="st-eyebrow">Companies &amp; Ventures</span>';
    if (comp === 'card') return `<div class="st-card"><div class="hd"><span class="bd"></span>Venture</div><div class="st-text"><span class="l"></span><span class="l" style="width:70%"></span></div></div>`;
    if (name === 'title') return '<span class="st-sub">Fractional founder</span>';
    if (name === 'tagline') return '<span class="st-tag">building apps for hoomans</span>';
    if (name === 'main') return `<div class="st-main"><span class="st-eyebrow">Bio</span><div class="st-text" style="margin-top:.4rem"><span class="l"></span><span class="l"></span><span class="l" style="width:60%"></span></div></div>`;
    if (name === 'footer') return '<div class="st-text"><span class="l" style="width:50%"></span></div>';
    return '<div class="st-text"><span class="l"></span><span class="l"></span><span class="l" style="width:55%"></span></div>';
  };
  const drawPattern = (k, mobile) => {
    const p = P[k]; const r = mobile && p.responsive ? p.responsive : null;
    const areas = (r && r.areas) || p.grid.areas;
    const cols = (r && r.columns) || (r ? '1fr' : p.grid.columns.replace('240px', '30%').replace('120px', 'auto'));
    const names = [...new Set(areas.join(' ').split(/\s+/))];
    const tpl = areas.map((a) => `"${a}"`).join(' ');
    const g = `grid-template-areas:${areas.map((a) => `'${a}'`).join(' ')};grid-template-columns:${cols};`;
    const wf = names.map((n) => `<div class="wf-box" style="grid-area:${n}"><div class="wf-tag"><span>${n}</span><em>${esc(p.regions[n]?.component || '')}</em></div>${wfFill(p.regions[n]?.component)}</div>`).join('');
    const st = names.map((n) => `<div class="st-region" style="grid-area:${n}">${stFill(p.regions[n]?.component, n)}</div>`).join('');
    return { g, wf, st, tpl };
  };
  app.append($(`<section id="patterns">${head('patterns', 'patterns.*.grid.areas', 'Wireframe and build from the same lines', 'A pattern is a list of <code>grid-template-areas</code> rows plus the component that fills each region. A designer reads it as boxes; a developer pastes it into CSS. Both panels below are drawn from the same entry.')}
    <div class="seg" role="group" aria-label="Viewport" id="vp" style="align-self:flex-start"><button type="button" data-vp="desktop" aria-pressed="true">Desktop</button><button type="button" data-vp="mobile" aria-pressed="false">Below 768px</button></div>
    <div id="pat-list" style="display:flex;flex-direction:column;gap:2rem"></div>
  </section>`));
  function renderPatterns(mobile) {
    document.getElementById('pat-list').innerHTML = keys(P).map((k) => { const d = drawPattern(k, mobile); return `<div class="pat"><div class="pat-head"><h3>${k}</h3><span class="small muted">${esc(P[k].purpose)}</span></div><div class="pat-views">
      <div class="view"><div class="view-label">Wireframe <code>${esc(d.tpl)}</code></div><div class="canvas wf"><div class="pgrid" style="${d.g}">${d.wf}</div></div></div>
      <div class="view"><div class="view-label">Styled <code>${esc(P[k].width || P[k].grid.columns)}</code></div><div class="canvas st"><div class="pgrid" style="${d.g}">${d.st}</div></div></div>
    </div></div>`; }).join('');
  }
  renderPatterns(false);
  document.getElementById('vp').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#vp button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderPatterns(b.dataset.vp === 'mobile'); });

  // 8. voice
  const V = S.voice;
  app.append($(`<section id="voice">${head('voice', 'voice', 'Warm, plain, a little wry', esc(V.summary))}
    <div class="voice-grid">${V.personality.map((p) => `<div class="trait">${esc(p)}</div>`).join('')}</div>
    <div class="ex"><div class="h c0">Context</div><div class="h">Write</div><div class="h">Not</div>${V.examples.map((x) => `<div class="ctx">${esc(x.context)}</div><div class="do">${esc(x.do)}</div><div class="dont">${esc(x.dont)}</div>`).join('')}</div>
    <div class="grid-2">
      <div class="panel"><h3>Principles</h3><ul style="margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.35rem" class="small">${V.principles.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>
      <div class="panel"><h3>Words</h3><div class="words">${V.vocabulary.use.map((w) => `<span class="word">${esc(w)}</span>`).join('')}</div><div class="words">${V.vocabulary.avoid.map((w) => `<span class="word no">${esc(w)}</span>`).join('')}</div><dl class="kv">${Object.entries(V.mechanics).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    </div>
  </section>`));

  // 9. rules, contrast, issues, acceptance
  app.append($(`<section id="rules">${head('rules', 'rules · contrast · knownIssues · acceptance', 'What an agent checks before it hands work back', 'Each rule names a check a person or script can run. <em>Must</em> blocks a release; <em>should</em> gets reviewed. Contrast is measured, and extraction found drift in the live site, which the spec records instead of hiding.')}
    <div class="table-wrap"><table><thead><tr><th>Rule</th><th>Level</th><th>Check</th></tr></thead><tbody>${S.rules.map((r) => `<tr><td><span class="mono" style="color:var(--text-strong)">${esc(r.id)}</span><div class="small" style="color:var(--text-light)">${esc(resolve(r.rule, 'light'))}</div></td><td><span class="lvl ${r.level}">${r.level}</span></td><td class="small muted">${esc(r.check)}</td></tr>`).join('')}</tbody></table></div>
    <div class="eyebrow">Contrast <span class="path">contrast[]</span></div>
    <div class="table-wrap"><table><thead><tr><th>Sample</th><th>Pair</th><th>Mode</th><th>Ratio</th><th>Result</th></tr></thead><tbody>${S.contrast.map((c) => { const fg = resolve(c.fg, c.mode), bg = resolve(c.bg, c.mode); return `<tr><td><span style="display:inline-block;padding:.25rem .6rem;border-radius:6px;background:${bg};color:${fg};font-weight:500;border:1px solid rgba(128,128,128,.25)">Hoomans</span></td><td class="css">${esc(c.fg)} on ${esc(c.bg)}</td><td class="small">${c.mode}</td><td class="ratio">${c.ratio.toFixed(2)}:1</td><td><span class="lvl ${c.pass.split(' ')[0]}">${esc(c.pass)}</span></td></tr>`; }).join('')}</tbody></table></div>
    <div class="eyebrow">Known issues in the live site <span class="path">knownIssues[]</span></div>
    <div class="table-wrap"><table><thead><tr><th>Issue</th><th>Severity</th><th>Fix</th></tr></thead><tbody>${S.knownIssues.map((i) => `<tr><td><span class="mono" style="color:var(--text-strong)">${esc(i.id)}</span><div class="small" style="color:var(--text-light)">${esc(i.issue)}</div><div class="css" style="white-space:normal">${esc(i.where)}</div></td><td><span class="lvl ${i.severity}">${i.severity}</span></td><td class="small">${esc(resolve(i.fix, 'dark'))}</td></tr>`).join('')}</tbody></table></div>
    <div class="eyebrow">Acceptance <span class="path">acceptance[]</span></div>
    <ul class="acc">${S.acceptance.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>
  </section>`));

  // 10. the file
  app.append($(`<section id="file">${head('file', 'design-spec/', 'The template, and this site filled in', 'Copy the template for a new site and fill every <span class="j-todo">TODO</span> top to bottom. Hand an agent the filled file with one instruction: build with this spec, use only role tokens, and run every rule and acceptance check before returning.')}
    <div class="facts"><a class="chip" href="/design-spec/template.spec.json">${icon('globe', 14)} <b>/design-spec/template.spec.json</b></a><a class="chip" href="/design-spec/shupp.spec.json">${icon('globe', 14)} <b>/design-spec/shupp.spec.json</b></a></div>
    <div class="file">
      <div class="file-bar">
        <div class="seg" role="group" aria-label="File" id="which"><button type="button" data-f="template" aria-pressed="true">template.spec.json</button><button type="button" data-f="spec" aria-pressed="false">shupp.spec.json</button></div>
        <button class="copy" type="button" id="copy">Copy file</button>
      </div>
      <div class="file-bar" style="background:transparent"><div class="tabs" id="ftabs"></div></div>
      <pre class="json" id="json" tabindex="0"></pre>
    </div>
  </section>`));
  let cur = 'template', layer = 'all';
  const hl = (s) => esc(s)
    .replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)/g, '<span class="j-k">$1</span>$2')
    .replace(/(:\s*|\[\s*|,\s*)(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, '$1<span class="j-s">$2</span>')
    .replace(/(:\s*)(-?\d+(?:\.\d+)?)/g, '$1<span class="j-n">$2</span>')
    .replace(/TODO/g, '<span class="j-todo">TODO</span>');
  function renderFile() {
    const obj = cur === 'template' ? T : S;
    const tabs = ['all', ...Object.keys(obj).filter((k) => !k.startsWith('$'))];
    document.getElementById('ftabs').innerHTML = tabs.map((t) => `<button type="button" data-l="${t}" aria-pressed="${t === layer}">${t}</button>`).join('');
    const txt = layer === 'all' ? RAW[cur] : JSON.stringify({ [layer]: obj[layer] }, null, 2);
    document.getElementById('json').innerHTML = hl(txt);
  }
  renderFile();
  document.getElementById('which').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; cur = b.dataset.f; layer = 'all'; document.querySelectorAll('#which button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderFile(); });
  document.getElementById('ftabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; layer = b.dataset.l; renderFile(); });
  document.getElementById('copy').addEventListener('click', (e) => {
    const btn = e.currentTarget; const done = (t) => { btn.textContent = t; setTimeout(() => (btn.textContent = 'Copy file'), 1600); };
    try { navigator.clipboard.writeText(RAW[cur]).then(() => done('Copied'), () => { selectJson(); done('Selected, press ⌘C'); }); } catch (_) { selectJson(); done('Selected, press ⌘C'); }
  });
  function selectJson() { const r = document.createRange(); r.selectNodeContents(document.getElementById('json')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  // ---- mode toggle
  const root = document.documentElement;
  const seg = document.querySelector('.side-foot .seg');
  function setMode(mode) {
    if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    try { localStorage.setItem('spec-mode', mode); } catch (_) {}
  }
  seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
  try { const saved = localStorage.getItem('spec-mode'); if (saved && saved !== 'system') setMode(saved); } catch (_) {}
  const preset = root.getAttribute('data-theme');
  if (preset) seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.mode === preset)));

  // ---- active nav
  const links = [...document.querySelectorAll('#nav .nav-link')];
  const io = new IntersectionObserver((ents) => { ents.forEach((en) => { if (en.isIntersecting) links.forEach((l) => l.classList.toggle('active', l.dataset.id === en.target.id)); }); }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('section[id]').forEach((s) => io.observe(s));
  links[0].classList.add('active');
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
